name: ci

on:
  pull_request:
    # ready_for_review: ready_wait_merge.sh は draft → ready の後に走る run を待つ（docs/agents/review-dialogue.md「CI が走る条件」）
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq shellcheck
          python -m pip install pytest pyyaml ruff
      - name: shellcheck
        run: shellcheck lib/*.sh plugins/dev-workflow/scripts/*.sh plugins/dev-workflow/hooks/*.sh plugins/dev-workflow/templates/*.sh .github/actions/*/*.sh
      - name: ruff
        run: ruff check .
      - name: pytest
        run: python -m pytest tests -q
      - name: No private names (public repository)
        run: |
          # 文字クラスで組んであり、このステップ自身にはヒットしない。
          if git grep -nIiE '[k]eiba|[j]rvltsql|[t]erraform|[a]urora'; then
            echo "公開リポに載せてはいけない語が含まれています" >&2
            exit 1
          fi
      - name: Agent headings agree (list, README, skills)
        run: python scripts/ci/check_heading_references.py --spec plugins/dev-workflow/agent-headings.json --readme README.md --plugin-root plugins/dev-workflow
      - name: Validate plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate .
